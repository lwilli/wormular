<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#05060E" />
    <title>Wormular · Stats</title>
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg0: #05060e;
        --bg1: #0e1230;
        --text: #f2f4f8;
        --muted: #9aa3b5;
        --accent: #ff7a18;
        --teal: #2ec4b6;
        --violet: #8a6dff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        color: var(--text);
        font-family: Fredoka, system-ui, sans-serif;
        background:
          radial-gradient(ellipse 90% 70% at 50% -10%, #1a1648 0%, transparent 55%),
          radial-gradient(ellipse 60% 50% at 85% 90%, rgba(46, 196, 182, 0.12), transparent 50%),
          radial-gradient(ellipse 50% 40% at 10% 80%, rgba(255, 122, 24, 0.1), transparent 45%),
          linear-gradient(180deg, var(--bg1), var(--bg0));
        min-height: 100vh;
        padding: clamp(1.5rem, 4vw, 3rem);
      }

      main {
        max-width: 42rem;
        margin: 0 auto;
      }

      header {
        margin-bottom: 2rem;
      }

      .brand {
        margin: 0;
        font-size: clamp(2rem, 6vw, 2.75rem);
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--accent);
        line-height: 1.1;
      }

      .sub {
        margin: 0.4rem 0 0;
        color: var(--muted);
        font-size: 1rem;
        font-weight: 500;
      }

      .meta {
        margin-top: 0.75rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.25rem;
        align-items: center;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .meta button {
        appearance: none;
        border: 1px solid rgba(242, 244, 248, 0.18);
        background: rgba(5, 6, 14, 0.35);
        color: var(--text);
        font: inherit;
        font-size: 0.85rem;
        padding: 0.35rem 0.75rem;
        border-radius: 0.4rem;
        cursor: pointer;
      }

      .meta button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .status[data-state='ok'] {
        color: var(--teal);
      }

      .status[data-state='err'] {
        color: #ff6b6b;
      }

      .status[data-state='loading'] {
        color: var(--muted);
      }

      .hero-stat {
        margin: 0 0 1.75rem;
      }

      .hero-stat .label {
        display: block;
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 500;
        margin-bottom: 0.25rem;
      }

      .hero-stat .value {
        font-size: clamp(3.5rem, 14vw, 5.5rem);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.02em;
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1.25rem 1.5rem;
      }

      @media (max-width: 480px) {
        .grid {
          grid-template-columns: 1fr 1fr;
          gap: 1rem;
        }
      }

      .stat .label {
        display: block;
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 500;
        margin-bottom: 0.15rem;
      }

      .stat .value {
        font-size: clamp(1.75rem, 6vw, 2.25rem);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
      }

      .stat[data-tone='orange'] .value {
        color: var(--accent);
      }

      .stat[data-tone='teal'] .value {
        color: var(--teal);
      }

      .stat[data-tone='violet'] .value {
        color: var(--violet);
      }

      .foot {
        margin-top: 2.5rem;
        color: var(--muted);
        font-size: 0.8rem;
        line-height: 1.45;
      }

      .foot a {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1 class="brand">Wormular</h1>
        <p class="sub">Visit &amp; play counters</p>
        <div class="meta">
          <span id="status" class="status" data-state="loading">Loading…</span>
          <span id="updated">—</span>
          <button type="button" id="refresh">Refresh</button>
        </div>
      </header>

      <section class="hero-stat" aria-label="Total visits">
        <span class="label">Visits</span>
        <div class="value" id="visits">—</div>
      </section>

      <section class="grid" aria-label="Play counts">
        <div class="stat" data-tone="orange">
          <span class="label">Solo plays</span>
          <div class="value" id="solo">—</div>
        </div>
        <div class="stat" data-tone="teal">
          <span class="label">Local 1v1</span>
          <div class="value" id="local">—</div>
        </div>
        <div class="stat" data-tone="violet">
          <span class="label">Online matches</span>
          <div class="value" id="online">—</div>
        </div>
        <div class="stat">
          <span class="label">Online queued</span>
          <div class="value" id="online_queue">—</div>
        </div>
      </section>

      <p class="foot">
        Cookieless first-party totals from the Wormular API. Auto-refreshes every 15s.
        <a id="play-link" href="./">Play</a>
        ·
        <a id="raw-link" href="#">Raw JSON</a>
      </p>
    </main>
    <script>
      const PROD_API = 'https://wormular-api.lwilli.workers.dev'
      const params = new URLSearchParams(location.search)
      const host = location.hostname
      const local =
        host === 'localhost' || host === '127.0.0.1' || host === '[::1]'
      const apiBase = (
        params.get('api') ||
        (local ? `${location.origin}/api` : PROD_API)
      ).replace(/\/$/, '')
      const statsUrl = `${apiBase}/stats`

      const el = (id) => document.getElementById(id)
      const statusEl = el('status')
      const updatedEl = el('updated')
      el('raw-link').href = statsUrl

      function fmt(n) {
        if (typeof n !== 'number' || !Number.isFinite(n)) return '—'
        return n.toLocaleString('en-US')
      }

      function setStatus(state, text) {
        statusEl.dataset.state = state
        statusEl.textContent = text
      }

      async function load() {
        setStatus('loading', 'Loading…')
        try {
          const res = await fetch(statsUrl, { cache: 'no-store' })
          if (!res.ok) throw new Error(`HTTP ${res.status}`)
          const data = await res.json()
          el('visits').textContent = fmt(data.visits)
          const plays = data.plays || {}
          el('solo').textContent = fmt(plays.solo)
          el('local').textContent = fmt(plays.local)
          el('online').textContent = fmt(plays.online)
          el('online_queue').textContent = fmt(plays.online_queue)
          updatedEl.textContent = `Updated ${new Date().toLocaleTimeString()}`
          setStatus('ok', 'Live')
        } catch (err) {
          setStatus('err', err instanceof Error ? err.message : 'Failed')
        }
      }

      el('refresh').addEventListener('click', () => {
        void load()
      })
      void load()
      setInterval(() => {
        void load()
      }, 15_000)
    </script>
  </body>
</html>
